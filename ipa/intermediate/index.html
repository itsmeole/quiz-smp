<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root {
    --bg:          #F7F6F2;
    --surface:     #FFFFFF;

    --line:        #E2E0D6;
    --accent:      #1A6B60;
    --accent-soft: #EAF3F1;

    --bad-soft:    #FAE9E5;

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; padding: 0; background: var(--bg); color: var(--ink);

  }
  .mono { font-family: 'Geist Mono', ui-monospace, monospace; }
  .wrap { max-width: 600px; margin: 0 auto; padding: 52px 24px 96px; }
  header.top { margin-bottom: 36px; }
  .quiz-label { font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  h1.title { font-family: 'Geist', sans-serif; font-size: clamp(22px,4.5vw,28px); font-weight: 600; line-height: 1.2; letter-spacing: -0.02em; margin: 0; color: var(--ink); text-wrap: balance; }
  p.sub { color: var(--muted); font-size: 14px; line-height: 1.65; margin: 10px 0 32px; max-width: 52ch; text-wrap: pretty; }
  .progress-row { display: flex; align-items: center; gap: 14px; margin-bottom: 24px; }
  .progress-track { flex: 1; height: 2px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .progress-fill { height: 100%; width: 0%; background: var(--accent); transition: width 0.4s cubic-bezier(0.4,0,0.2,1); }
  .progress-label { font-family: 'Geist Mono', monospace; font-size: 12px; color: var(--muted); white-space: nowrap; min-width: 6ch; text-align: right; }

  .question-text { font-size: 17px; font-weight: 500; line-height: 1.55; margin: 0 0 24px; text-wrap: pretty; }
  .code-panel { background: var(--panel); color: var(--panel-ink); border-radius: 6px; padding: 20px 22px; font-family: 'Geist Mono', monospace; font-size: 13.5px; line-height: 1.9; overflow-x: auto; margin: 0 0 24px; white-space: pre; }
  .blank-code { font-family: 'Geist Mono', monospace; font-weight: 600; font-size: 13.5px; background: rgba(255,255,255,0.10); border: none; border-bottom: 1.5px solid #7EC1B8; color: #E8E6DE; padding: 0 5px; min-width: 5ch; outline: none; text-align: center; vertical-align: baseline; border-radius: 2px 2px 0 0; transition: background 0.2s ease, border-color 0.2s ease; white-space: normal; }
  .blank-code:focus { background: rgba(126,193,184,0.18); }
  .blank-code:disabled { opacity: 1; }
  .blank-code.ok { border-bottom-color: #6BC98E; background: rgba(107,201,142,0.18); }
  .blank-code.no { border-bottom-color: #E05A40; background: rgba(224,90,64,0.18); }
  .sentence-panel { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 18px 22px; font-size: 15.5px; line-height: 1.9; margin: 0 0 22px; }
  .blank-input { font-family: 'Geist Mono', monospace; font-weight: 600; font-size: 15px; background: transparent; border: none; border-bottom: 1.5px solid var(--accent); color: var(--ink); padding: 2px 6px; border-radius: 0; min-width: 8ch; outline: none; text-align: center; transition: background 0.2s ease, border-color 0.2s ease; }
  .blank-input:focus { background: var(--accent-soft); border-radius: 3px 3px 0 0; }
  .blank-input:disabled { opacity: 1; }
  .options { display: flex; flex-direction: column; gap: 8px; }
  .opt-btn { text-align: left; padding: 12px 16px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); font-size: 14.5px; font-family: inherit; color: var(--ink); cursor: pointer; transition: border-color 0.2s ease, background 0.2s ease, transform 0.1s ease; display: flex; align-items: baseline; gap: 10px; }
  .opt-btn .k { font-family: 'Geist Mono', monospace; font-size: 11px; font-weight: 600; color: var(--muted); flex-shrink: 0; width: 1.6em; }
  .opt-btn:hover:not(:disabled) { border-color: var(--accent); background: var(--accent-soft); }
  .opt-btn:active:not(:disabled) { transform: scale(0.99); }
  .opt-btn:disabled { cursor: default; }
  .opt-btn.correct { border-color: var(--good); background: var(--good-soft); color: var(--good); font-weight: 500; }
  .opt-btn.incorrect { border-color: var(--bad); background: var(--bad-soft); color: var(--bad); font-weight: 500; }

  .feedback { margin-top: 20px; padding: 12px 16px; border-radius: 6px; font-size: 14px; line-height: 1.6; display: none; border-left: 3px solid transparent; }

  .feedback.good { background: var(--good-soft); color: #14562E; border-left-color: var(--good); }
  .feedback.bad  { background: var(--bad-soft);  color: #832B1A; border-left-color: var(--bad); }
  .next-row { margin-top: 24px; display: flex; justify-content: flex-end; }
  .btn-primary { background: var(--ink); color: var(--bg); border: none; padding: 10px 22px; border-radius: var(--radius); font-size: 14px; font-family: inherit; font-weight: 500; cursor: pointer; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, background 0.2s ease, transform 0.1s ease; letter-spacing: 0.01em; }

  .score-big { font-family: 'Geist Mono', monospace; font-size: 72px; font-weight: 600; line-height: 1; margin: 12px 0 6px; color: var(--ink); letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }

  .result-msg { font-size: 17px; font-weight: 600; margin-bottom: 6px; }

  .student-info .value { font-size: 15px; font-weight: 500; color: var(--ink); }
  .form-group { margin-bottom: 16px; }

  #cheat-box p { margin: 0 0 20px; font-size: 13.5px; color: var(--muted); line-height: 1.6; }

  .integrity-badge { display: inline-flex; align-items: center; gap: 6px; padding: 6px 14px; border-radius: 20px; font-size: 13px; font-weight: 600; margin: 8px 0 14px; }
  .integrity-badge.clean { background: var(--good-soft); color: var(--good); border: 1px solid rgba(30, 120, 69, 0.25); }
  .integrity-badge.warn { background: var(--bad-soft); color: var(--bad); border: 1px solid rgba(176, 58, 37, 0.25); }
  .cheat-shield { display: inline-flex; align-items: center; gap: 5px; font-size: 11.5px; font-weight: 600; color: var(--muted); background: #EDECE6; padding: 2px 8px; border-radius: 6px; letter-spacing: 0.02em; margin-left: auto; }
  @media (max-width: 480px) { .wrap { padding: 36px 18px 72px; } .card { padding: 24px 20px; } .student-info { flex-direction: column; gap: 12px; } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>

  const p = location.pathname.toLowerCase().replace(/\/index\.html$/, "").replace(/\/$/, "").split("/").pop().replace(/\.html$/, "");
  return LEVELS[q] ? q : (LEVELS[p] ? p : "intermediate");
})();

let QUESTIONS = [];
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

/* Ambil 25 soal acak dari level aktif; usahakan topik tidak berulang, urutan soal & pilihan jawaban diacak */
function pickQuestions() {
  const pool = shuffle((QUESTION_BANK[LEVEL] || []).slice());
  const seen = new Set(), first = [], rest = [];
  pool.forEach(x => {
    if (seen.has(x[0])) rest.push(x);
    else { seen.add(x[0]); first.push(x); }
  });
  return shuffle(first.concat(rest).slice(0, QUIZ_N)).map(([topic, q, right, ...wrong]) => {
    const options = shuffle([right, ...wrong]);
    return {
      type: "mcq",
      topic,
      q,
      options,
      answer: options.indexOf(right),
      explain: "Jawaban yang benar: <strong>" + right + "</strong>."
    };
  });
}

const MAX_VIOLATIONS = 3;

let quizDone = false;

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function renderStart() {
  card.innerHTML = `<div>

    <button class="btn-primary show" id="start-btn">Mulai kuis</button>
  </div>`;

  document.getElementById("start-btn").addEventListener("click", () => {

    if (!n.value.trim() || !c.value.trim()) {
      alert("Mohon isi nama dan kelas terlebih dahulu.");
      return;
    }
    studentName = n.value.trim();
    studentClass = c.value.trim();
    QUESTIONS = pickQuestions();
    current = 0;
    score = 0;
    recap.length = 0;
    introSub.style.display = "none";
    progressRow.style.display = "flex";
    renderQuestion();
  });
}

function renderQuestion() {
  quizActive = true;
  quizDone = false;
  locked = false;
  const q = QUESTIONS[current];
  progressFill.style.width = `${(current / QUESTIONS.length) * 100}%`;
  progressLabel.textContent = `${current + 1}/${QUESTIONS.length}`;

  const opts = `<div class="options">` + q.options.map((o, i) =>
    `<button class="opt-btn" data-i="${i}"><span class="k mono">${String.fromCharCode(65 + i)}</span>${o}</button>`
  ).join("") + `</div>`;

  card.innerHTML = `<div>
    <div style="display:flex;align-items:center;margin-bottom:20px;">
      <span class="tag" style="margin-bottom:0;">${q.topic}</span>
      <span class="cheat-shield">🔒 Anti-Curang Aktif</span>
    </div>
    <p class="question-text">${q.q}</p>
    ${opts}
    <div class="feedback" id="feedback"></div>
    <div class="next-row"><button class="btn-primary" id="next-btn">${current < QUESTIONS.length - 1 ? "Soal berikutnya" : "Lihat hasil"}</button></div>
  </div>`;

  card.querySelectorAll(".opt-btn").forEach(btn => {
    btn.addEventListener("click", () => handleMcq(btn, q));
  });
}

function handleMcq(btn, q) {
  if (locked) return;
  locked = true;
  const allButtons = card.querySelectorAll(".opt-btn");
  const ok = parseInt(btn.dataset.i, 10) === q.answer;
  allButtons.forEach(b => {
    if (parseInt(b.dataset.i, 10) === q.answer) b.classList.add("correct");
    else if (b === btn) b.classList.add("incorrect");
    b.disabled = true;
  });
  if (ok) score++;
  recap.push({ ok, text: q.q.slice(0, 60) + (q.q.length > 60 ? "…" : "") });
  const fb = document.getElementById("feedback");
  fb.className = "feedback show " + (ok ? "good" : "bad");
  fb.innerHTML = `<strong>${ok ? "Tepat." : "Belum tepat."}</strong> ${q.explain}`;
  document.getElementById("next-btn").classList.add("show");
  document.getElementById("next-btn").addEventListener("click", () => {
    current++;
    current < QUESTIONS.length ? renderQuestion() : renderResult();
  }, { once: true });
}

function renderResult() {
  progressFill.style.width = "100%";
  progressLabel.textContent = `${QUESTIONS.length}/${QUESTIONS.length}`;

  quizActive = false;
  quizDone = true;
  isSuspended = false;
  if (suspendTimer) {
    clearInterval(suspendTimer);
    suspendTimer = null;
  }
  const ov = document.getElementById("cheat-overlay");
  if (ov) ov.classList.remove("show");

  const total = QUESTIONS.length, pct = score / total;
  let msg, sub;
  if (pct >= 0.9) { msg = "Luar biasa!"; sub = "Pemahaman materi IPA kamu sudah sangat matang dan mendalam."; }
  else if (pct >= 0.7) { msg = "Kerja bagus!"; sub = "Sebagian besar materi IPA sudah kamu kuasai dengan sangat baik."; }
  else if (pct >= 0.5) { msg = "Cukup baik."; sub = "Sudah memahami konsep dasar IPA, tinjau kembali nomor-nomor yang meleset."; }
  else { msg = "Terus semangat belajar."; sub = "Pelajari kembali materi IPA di buku catatan, lalu coba kuis ini lagi."; }

  const recapHtml = recap.map(r => `<div class="recap-item"><span class="mark ${r.ok ? "ok" : "no"}">${r.ok ? "OK" : "X"}</span><span>${r.text}</span></div>`).join("");
  card.innerHTML = `
    <div class="result">
      <div class="tag">Selesai</div>
      <div class="student-info">
        <div class="si-group"><span class="label">Nama</span><span class="value">${esc(studentName)}</span></div>

      </div>
      <div style="text-align:center;">
        <div class="integrity-badge ${violations > 0 ? 'warn' : 'clean'}">
          ${violations > 0 ? `⚠️ Catatan Integritas: Terdeteksi ${violations}× Berpindah Tab/Layar` : `✓ Integritas Ujian: Bersih (0 Pelanggaran Tab)`}
        </div>
      </div>
      <div id="sync-container" style="text-align:center;"></div>
      <div class="score-big mono">${score}/${total}</div>
      <div class="score-of">jawaban benar</div>
      <div class="result-msg">${msg}</div>
      <p class="result-sub">${sub}</p>
      <div class="recap">${recapHtml}</div>
      <button class="btn-restart" id="restart-btn">Ulangi kuis</button>
    </div>`;

  if (typeof displaySupabaseSyncStatus === "function") {
    displaySupabaseSyncStatus(document.getElementById("sync-container"), {
      student_name: studentName,
      student_class: studentClass,
      subject: "Ilmu Pengetahuan Alam (IPA) - " + LEVELS[LEVEL],
      score: score,
      total_questions: total,
      percentage: (score / total) * 100,
      violations: violations
    });
  }

  document.getElementById("restart-btn").addEventListener("click", () => {
    current = 0; score = 0; recap.length = 0; studentName = ""; studentClass = "";
    violations = 0;
    quizActive = false;
    quizDone = false;
    isSuspended = false;
    if (suspendTimer) {
      clearInterval(suspendTimer);
      suspendTimer = null;
    }
    progressFill.style.width = "0%";
    progressLabel.textContent = `1/${QUESTIONS.length}`;
    introSub.style.display = "block";
    progressRow.style.display = "none";
    renderStart();
  });
}

/* ── Anti-Curang System ── */
function playWarningBeep() {
  try {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    if (!AudioContext) return;
    const ctx = new AudioContext();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(600, ctx.currentTime);
    osc.frequency.setValueAtTime(880, ctx.currentTime + 0.1);
    gain.gain.setValueAtTime(0.2, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.35);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + 0.35);
  } catch(e) {}
}

function triggerViolation(reason) {
  if (!quizActive || quizDone || isSuspended) return;

  violations++;
  playWarningBeep();

  const overlay = document.getElementById("cheat-overlay");
  const title = document.getElementById("cheat-title");
  const msg = document.getElementById("cheat-msg");
  const countdown = document.getElementById("cheat-countdown");
  const warnCount = document.getElementById("cheat-warning-count");

  if (violations > MAX_VIOLATIONS) {
    endQuizByCheat();
    return;
  }

  isSuspended = true;
  overlay.classList.add("show");

  if (violations === MAX_VIOLATIONS) {
    title.textContent = "Peringatan Terakhir (3 / 3)!";
    msg.textContent = `Ini adalah pelanggaran ke-3. Kuis dikunci selama 30 detik. Jika Anda berpindah tab sekali lagi, kuis akan langsung diakhiri dan jawaban dikumpulkan seadanya!`;
  } else {
    title.textContent = `Tab Berpindah Terdeteksi (Pelanggaran ${violations} / ${MAX_VIOLATIONS})`;
    msg.textContent = `Terdeteksi keluar dari halaman kuis. Kuis dikunci selama 30 detik. Anda harus tetap berada di halaman ini untuk melanjutkan.`;
  }

  warnCount.textContent = `Pelanggaran: ${violations} / ${MAX_VIOLATIONS}`;

  let secs = SUSPEND_SECS;
  countdown.textContent = secs;

  if (suspendTimer) clearInterval(suspendTimer);

  suspendTimer = setInterval(() => {
    if (!document.hidden) {
      secs--;
      countdown.textContent = secs;
      if (secs <= 0) {
        clearInterval(suspendTimer);
        suspendTimer = null;
        isSuspended = false;
        overlay.classList.remove("show");
      }
    }
  }, 1000);
}

function endQuizByCheat() {
  quizActive = false;
  quizDone = true;
  isSuspended = false;
  if (suspendTimer) clearInterval(suspendTimer);

  const overlay = document.getElementById("cheat-overlay");
  if (overlay) overlay.classList.remove("show");

  renderResult();

  const resultDiv = card.querySelector(".result");
  if (resultDiv) {
    const banner = document.createElement("div");
    banner.style.cssText = "background:var(--bad-soft);border:1px solid var(--bad);border-left:4px solid var(--bad);color:var(--bad);border-radius:8px;padding:14px 18px;font-size:14px;margin-bottom:20px;line-height:1.5;text-align:left;";
    banner.innerHTML = `<strong>⚠️ Kuis Diakhiri Otomatis karena Melebihi Batas Toleransi Pelanggaran (Maks. 3 Kali)!</strong><br>Terdeteksi keluar tab/layar sebanyak ${violations} kali. Jawaban Anda telah otomatis dikumpulkan seadanya ke database. Nilai dihitung berdasarkan soal yang sudah dijawab.`;
    resultDiv.prepend(banner);
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden && quizActive && !quizDone) {
    triggerViolation("visibilitychange");
  }
});

document.addEventListener("contextmenu", e => {
  if (quizActive && !quizDone) e.preventDefault();
});
document.addEventListener("copy", e => {
  if (quizActive && !quizDone) e.preventDefault();
});
document.addEventListener("cut", e => {
  if (quizActive && !quizDone) e.preventDefault();
});

window.getQuizViolations = function() {
  return violations;
};

document.querySelector("h1.title").textContent = "Uji Pemahaman IPA \u00b7 " + LEVELS[LEVEL];
document.title = "Uji Pemahaman IPA \u00b7 " + LEVELS[LEVEL];
introSub.textContent = "25 soal pilihan ganda yang diacak dari bank soal IPA SMP. Setiap siswa mendapat kombinasi soal yang berbeda.";
renderStart();
</script>
