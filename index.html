<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Uji pemahaman Informatika Bab 2 — computational thinking, fungsi, himpunan data terstruktur, dan struktur data stack.">
<title>Uji Pemahaman · Informatika Bab 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:          #F7F6F2;
    --surface:     #FFFFFF;
    --ink:         #1A1A18;
    --muted:       #76756E;
    --line:        #E2E0D6;
    --accent:      #1A6B60;
    --accent-soft: #EAF3F1;
    --good:        #1E7845;
    --good-soft:   #E8F4ED;
    --bad:         #B03A25;
    --bad-soft:    #FAE9E5;
    --panel:       #1C1C19;
    --panel-ink:   #E8E6DE;
    --radius:      8px;
    --z-overlay:   100;
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .mono {
    font-family: 'Geist Mono', ui-monospace, monospace;
  }

  /* ── Layout ── */
  .wrap {
    max-width: 600px;
    margin: 0 auto;
    padding: 52px 24px 96px;
  }

  header.top {
    margin-bottom: 36px;
  }

  .quiz-label {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  h1.title {
    font-family: 'Geist', sans-serif;
    font-size: clamp(22px, 4.5vw, 28px);
    font-weight: 600;
    line-height: 1.2;
    letter-spacing: -0.02em;
    margin: 0;
    color: var(--ink);
    text-wrap: balance;
  }

  p.sub {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.65;
    margin: 10px 0 32px;
    max-width: 52ch;
    text-wrap: pretty;
  }

  /* ── Progress ── */
  .progress-row {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 24px;
  }

  .progress-track {
    flex: 1;
    height: 2px;
    background: var(--line);
    border-radius: 2px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .progress-label {
    font-family: 'Geist Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
    min-width: 6ch;
    text-align: right;
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 32px;
  }

  /* ── Type badge ── */
  .tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 3px 8px;
    border-radius: 4px;
    margin-bottom: 20px;
  }

  /* ── Question text ── */
  .question-text {
    font-size: 17px;
    font-weight: 500;
    line-height: 1.55;
    margin: 0 0 24px;
    color: var(--ink);
    text-wrap: pretty;
  }

  /* ── Code panel ── */
  .code-panel {
    background: var(--panel);
    color: var(--panel-ink);
    border-radius: 6px;
    padding: 16px 20px;
    font-family: 'Geist Mono', monospace;
    font-size: 13.5px;
    line-height: 1.75;
    overflow-x: auto;
    margin: 0 0 24px;
    white-space: pre;
  }
  .code-panel .tg { color: #7EC1B8; }
  .code-panel .at { color: #C9A15A; }
  .code-panel .st { color: #B98BC9; }
  .code-panel .pr { color: #7EC1B8; }
  .code-panel .vl { color: #C9A15A; }
  .code-panel .cm { color: #666; }

  /* ── Sentence fill panel ── */
  .sentence-panel {
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 18px 22px;
    font-size: 15.5px;
    line-height: 1.9;
    margin: 0 0 22px;
  }

  /* ── Options ── */
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .opt-btn {
    text-align: left;
    padding: 12px 16px;
    border: 1px solid var(--line);
    background: var(--surface);
    border-radius: var(--radius);
    font-size: 14.5px;
    font-family: inherit;
    color: var(--ink);
    cursor: pointer;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.1s ease;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }

  .opt-btn .k {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    flex-shrink: 0;
    width: 1.6em;
  }

  .opt-btn:hover:not(:disabled) {
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  .opt-btn:active:not(:disabled) { transform: scale(0.99); }
  .opt-btn:disabled { cursor: default; }

  .opt-btn.correct {
    border-color: var(--good);
    background: var(--good-soft);
    color: var(--good);
    font-weight: 500;
  }

  .opt-btn.incorrect {
    border-color: var(--bad);
    background: var(--bad-soft);
    color: var(--bad);
    font-weight: 500;
  }

  /* ── True/False ── */
  .tf-row {
    display: flex;
    gap: 10px;
  }

  .tf-row .opt-btn {
    flex: 1;
    justify-content: center;
    text-align: center;
  }

  /* ── Fill input ── */
  .blank-input {
    font-family: 'Geist Mono', monospace;
    font-weight: 600;
    font-size: 15px;
    background: transparent;
    border: none;
    border-bottom: 1.5px solid var(--accent);
    color: var(--ink);
    padding: 2px 6px;
    border-radius: 0;
    min-width: 8ch;
    outline: none;
    text-align: center;
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .blank-input:focus {
    background: var(--accent-soft);
    border-radius: 3px 3px 0 0;
  }

  .blank-input:disabled { opacity: 1; }

  /* ── Feedback ── */
  .check-row { margin-bottom: 4px; }

  .feedback {
    margin-top: 20px;
    padding: 12px 16px;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1.6;
    display: none;
    border-left: 3px solid transparent;
  }

  .feedback.show { display: block; }

  .feedback.good {
    background: var(--good-soft);
    color: #14562E;
    border-left-color: var(--good);
  }

  .feedback.bad {
    background: var(--bad-soft);
    color: #832B1A;
    border-left-color: var(--bad);
  }

  /* ── Buttons ── */
  .next-row {
    margin-top: 24px;
    display: flex;
    justify-content: flex-end;
  }

  .btn-primary {
    background: var(--ink);
    color: var(--bg);
    border: none;
    padding: 10px 22px;
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, background 0.2s ease, transform 0.1s ease;
    letter-spacing: 0.01em;
  }

  .btn-primary.show {
    opacity: 1;
    pointer-events: auto;
  }

  .btn-primary:hover { background: var(--accent); }
  .btn-primary:active { transform: scale(0.98); }

  /* ── Result ── */
  .result {
    text-align: center;
    padding: 16px 0 8px;
  }

  .score-big {
    font-family: 'Geist Mono', monospace;
    font-size: 72px;
    font-weight: 600;
    line-height: 1;
    margin: 12px 0 6px;
    color: var(--ink);
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
  }

  .score-of {
    color: var(--muted);
    font-size: 13px;
    letter-spacing: 0.02em;
    margin-bottom: 28px;
  }

  .result-msg {
    font-size: 17px;
    font-weight: 600;
    margin-bottom: 6px;
  }

  .result-sub {
    color: var(--muted);
    font-size: 14px;
    max-width: 38ch;
    margin: 0 auto 28px;
    line-height: 1.65;
    text-wrap: pretty;
  }

  /* ── Student info ── */
  .student-info {
    display: flex;
    gap: 32px;
    justify-content: center;
    background: var(--bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 16px 24px;
    margin: 0 0 24px;
    text-align: left;
  }

  .student-info .si-group { display: flex; flex-direction: column; gap: 2px; }

  .student-info .label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.07em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .student-info .value {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
  }

  /* ── Form ── */
  .form-group { margin-bottom: 16px; }

  .form-group label {
    display: block;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 6px;
    color: var(--muted);
  }

  .form-group input {
    width: 100%;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    font-size: 15px;
    font-family: inherit;
    color: var(--ink);
    background: var(--surface);
    transition: border-color 0.2s ease, background 0.2s ease;
  }

  .form-group input:focus {
    outline: none;
    border-color: var(--accent);
    background: var(--accent-soft);
  }

  /* ── Recap ── */
  .recap {
    text-align: left;
    border-top: 1px solid var(--line);
    padding-top: 20px;
    margin-top: 8px;
  }

  .recap-item {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 7px 0;
    font-size: 13px;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
  }

  .recap-item:last-child { border-bottom: none; }

  .recap-item .mark {
    font-family: 'Geist Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    flex-shrink: 0;
    width: 2ch;
  }

  .recap-item .mark.ok { color: var(--good); }
  .recap-item .mark.no { color: var(--bad); }

  .btn-restart {
    margin-top: 28px;
    background: transparent;
    color: var(--muted);
    border: 1px solid var(--line);
    padding: 10px 22px;
    border-radius: var(--radius);
    font-size: 14px;
    font-family: inherit;
    font-weight: 500;
    cursor: pointer;
    transition: border-color 0.2s ease, color 0.2s ease, background 0.2s ease;
  }

  .btn-restart:hover {
    border-color: var(--ink);
    color: var(--ink);
  }

  /* ── Anti-Curang ── */
  #cheat-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(26, 26, 24, 0.88);
    z-index: var(--z-overlay);
    align-items: center;
    justify-content: center;
    padding: 32px;
  }
  #cheat-overlay.show { display: flex; }

  #cheat-box {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 36px 32px;
    max-width: 340px;
    width: 100%;
    text-align: center;
  }

  #cheat-box h2 {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 600;
    color: var(--ink);
  }

  #cheat-box p {
    margin: 0 0 20px;
    font-size: 13.5px;
    color: var(--muted);
    line-height: 1.6;
  }

  #cheat-countdown {
    font-family: 'Geist Mono', monospace;
    font-size: 52px;
    font-weight: 600;
    color: var(--bad);
    line-height: 1;
    margin-bottom: 10px;
    font-variant-numeric: tabular-nums;
  }

  #cheat-warning-count {
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  @media (max-width: 480px) {
    .wrap { padding: 36px 18px 72px; }
    .card { padding: 24px 20px; }
    .student-info { flex-direction: column; gap: 12px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="quiz-label">Informatika · Bab 2</p>
    <h1 class="title">Uji Pemahaman</h1>
    <p class="sub" id="intro-sub">Computational thinking, fungsi, himpunan data terstruktur, dan struktur data stack.</p>
  </header>

  <div class="progress-row" id="progress-row" style="display:none;">
    <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-label mono" id="progress-label">1</div>
  </div>

  <div class="card" id="card"></div>
</div>

<div id="cheat-overlay">
  <div id="cheat-box">
    <h2 id="cheat-title">Tab berpindah terdeteksi</h2>
    <p id="cheat-msg">Kuis dikunci sementara. Tunggu hingga hitungan selesai.</p>
    <div id="cheat-countdown">30</div>
    <div id="cheat-warning-count"></div>
  </div>
</div>

<script>
const QUESTIONS = [
  {
    type: "mcq",
    q: "Computational Thinking (berpikir komputasional) merupakan metode pemecahan masalah yang bersifat sistematis dan logis, di mana masalah diuraikan dan solusinya dirumuskan agar dapat dijalankan secara efektif oleh…",
    options: ["Hanya komputer", "Manusia maupun sistem", "Hanya manusia", "Robot semata"],
    answer: 1,
    explain: "Computational Thinking dirancang agar solusinya bisa dijalankan secara efektif baik oleh manusia maupun oleh sistem (komputer)."
  },
  {
    type: "fill",
    prompt: "Lengkapi kalimat berikut dengan istilah pilar Computational Thinking yang tepat.",
    before: "Pilar Computational Thinking yang memecah masalah atau sistem kompleks menjadi bagian-bagian yang lebih kecil, spesifik, dan mudah dikelola disebut ",
    after: ".",
    accepted: ["decomposition", "dekomposisi"],
    explain: "Decomposition (dekomposisi) memecah masalah besar menjadi bagian-bagian kecil yang lebih mudah diselesaikan."
  },
  {
    type: "mcq",
    q: "Pilar Computational Thinking yang berfungsi untuk mencari keteraturan, tren, atau kesamaan dalam masalah yang sedang dipecahkan disebut…",
    options: ["Abstraction", "Algorithm", "Pattern recognition", "Decomposition"],
    answer: 2,
    explain: "Pattern recognition adalah proses mengenali pola atau kesamaan dari masalah yang sedang dihadapi."
  },
  {
    type: "fill",
    prompt: "Lengkapi kalimat berikut dengan istilah pilar Computational Thinking yang tepat.",
    before: "Pilar Computational Thinking yang memilah dan menyaring informasi penting yang relevan dengan solusi, serta mengabaikan detail-detail kecil yang tidak krusial, disebut ",
    after: ".",
    accepted: ["abstraction", "abstraksi"],
    explain: "Abstraction (abstraksi) berfokus pada informasi penting dan mengabaikan detail yang tidak relevan dengan solusi."
  },
  {
    type: "mcq",
    q: "Merancang instruksi atau serangkaian langkah logis yang terurut secara sistematis untuk mencapai tujuan atau menyelesaikan masalah adalah pengertian dari…",
    options: ["Algorithm", "Pattern recognition", "Abstraction", "Decomposition"],
    answer: 0,
    explain: "Algorithm (algoritma) adalah rangkaian langkah logis dan terurut untuk mencapai suatu tujuan atau solusi."
  },
  {
    type: "fill",
    prompt: "Lengkapi kalimat berikut dengan istilah pilar Computational Thinking yang tepat.",
    before: "Pada kasus membuat sarapan roti panggang isi selai dan hot milk tea, mengambil kesimpulan tugas inti seperti 'membuat roti panggang' dan 'membuat hot milk tea' dari cerita panjang merupakan contoh penerapan pilar ",
    after: ".",
    accepted: ["decomposition", "dekomposisi"],
    explain: "Mengambil tugas inti dari informasi yang panjang adalah bentuk decomposition, yaitu memecah masalah menjadi bagian-bagian yang lebih spesifik."
  },
  {
    type: "mcq",
    q: "Mengenali bahwa 'roti dipanggang', 'air dipanaskan', dan 'teh ditambah susu' merupakan pola berulang dalam kegiatan menyiapkan sarapan adalah contoh penerapan pilar…",
    options: ["Algorithm", "Pattern recognition", "Abstraction", "Decomposition"],
    answer: 1,
    explain: "Mengenali pola dari beberapa kegiatan yang mirip merupakan contoh pattern recognition."
  },
  {
    type: "mcq",
    q: "Ketika menyiapkan sarapan, membuang detail yang tidak penting (misalnya alasan ibu sedang sibuk) dan hanya berfokus pada hal-hal penting seperti jenis roti dan rasa selai adalah contoh penerapan pilar…",
    options: ["Abstraction", "Algorithm", "Decomposition", "Pattern recognition"],
    answer: 0,
    explain: "Abstraction membuang detail yang tidak relevan dan hanya menyisakan informasi penting untuk penyelesaian masalah."
  },
  {
    type: "mcq",
    q: "Fungsi merupakan bagian dari sebuah 'mesin komputasi' yang menerima input, melakukan proses tertentu, dan…",
    options: ["Menyimpan input secara permanen", "Menghasilkan output", "Menghapus proses sebelumnya", "Menggandakan input"],
    answer: 1,
    explain: "Fungsi menerima input, memprosesnya, lalu menghasilkan output sebagai hasil akhirnya."
  },
  {
    type: "fill",
    prompt: "Lengkapi kalimat berikut dengan istilah yang tepat.",
    before: "Pada contoh mesin ATM, memasukkan pin, menekan opsi tarik tunai, dan memasukkan nominal uang merupakan tahap ",
    after: " dalam sebuah fungsi.",
    accepted: ["input", "masukan"],
    explain: "Tindakan pengguna memasukkan data ke mesin (pin, opsi, nominal) merupakan tahap input pada fungsi."
  },
  {
    type: "mcq",
    q: "Dalam matematika, fungsi adalah relasi yang menghubungkan setiap elemen dalam himpunan input dengan tepat satu elemen dalam himpunan output. Himpunan input pada fungsi disebut…",
    options: ["Kodomain", "Range", "Domain", "Himpunan kosong"],
    answer: 2,
    explain: "Himpunan input pada fungsi disebut domain, sedangkan himpunan output disebut kodomain."
  },
  {
    type: "fill",
    prompt: "Lengkapi kalimat berikut dengan istilah yang tepat.",
    before: "Himpunan output dari suatu fungsi disebut ",
    after: ".",
    accepted: ["kodomain"],
    explain: "Kodomain adalah himpunan yang memuat seluruh kemungkinan output dari suatu fungsi."
  },
  {
    type: "mcq",
    q: "Selama input suatu fungsi tidak berubah, maka…",
    options: ["Output akan selalu berubah-ubah", "Output akan selalu sama", "Proses akan dihentikan", "Fungsi akan error"],
    answer: 1,
    explain: "Salah satu sifat fungsi adalah, selama input tidak berubah, output yang dihasilkan akan selalu sama. Namun, input yang berbeda bisa saja menghasilkan output yang sama."
  },
  {
    type: "mcq",
    q: "Dalam ilmu komputasi, fungsi dapat diartikan sebagai…",
    options: ["Data yang tidak dapat diubah", "Prosedur atau blok kode yang menerima input, memproses, dan memberikan output", "Kumpulan objek yang memiliki ciri sama", "Struktur data LIFO"],
    answer: 1,
    explain: "Dalam komputasi, fungsi adalah prosedur atau blok kode yang menerima input, melakukan proses tertentu, dan memberikan output."
  },
  {
    type: "fill",
    prompt: "Lengkapi kalimat berikut dengan istilah yang tepat.",
    before: "Proses memecah sebuah fungsi besar menjadi fungsi-fungsi yang lebih kecil disebut ",
    after: " fungsi.",
    accepted: ["dekomposisi", "decomposition"],
    explain: "Dekomposisi fungsi memecah fungsi besar menjadi bagian-bagian kecil agar lebih mudah dikelola dan diubah."
  },
  {
    type: "mcq",
    q: "Salah satu manfaat dekomposisi fungsi adalah…",
    options: ["Membuat program menjadi lebih lambat", "Mempermudah membuat perubahan program tanpa mengubah keseluruhan program", "Menghilangkan kebutuhan akan output", "Menggabungkan seluruh fungsi menjadi satu blok besar"],
    answer: 1,
    explain: "Dengan dekomposisi, perubahan cukup dilakukan pada fungsi kecil tertentu tanpa mengubah keseluruhan program."
  },
  {
    type: "mcq",
    q: "Himpunan adalah…",
    options: ["Kumpulan objek yang memiliki kesamaan ciri yang jelas dan dapat didefinisikan dengan tepat", "Kumpulan angka acak tanpa pola", "Struktur data yang menerapkan prinsip LIFO", "Prosedur yang menerima input dan output"],
    answer: 0,
    explain: "Himpunan adalah kumpulan objek dengan ciri yang jelas dan dapat didefinisikan secara tepat."
  },
  {
    type: "fill",
    prompt: "Lengkapi kalimat berikut dengan istilah yang tepat.",
    before: "Himpunan dilambangkan dengan huruf ",
    after: ", seperti A, B, atau C, dan anggotanya dituliskan di dalam simbol kurung kurawal.",
    accepted: ["kapital", "besar", "huruf kapital", "huruf besar"],
    explain: "Himpunan biasa dilambangkan dengan huruf kapital, sedangkan anggotanya ditulis dalam tanda kurung kurawal { }."
  },
  {
    type: "fill",
    prompt: "Lengkapi kalimat berikut dengan istilah yang tepat.",
    before: "Himpunan yang tidak memiliki anggota sama sekali disebut himpunan ",
    after: ", dilambangkan dengan ∅.",
    accepted: ["kosong"],
    explain: "Himpunan kosong adalah himpunan yang tidak memiliki anggota, dilambangkan dengan simbol ∅."
  },
  {
    type: "mcq",
    q: "Himpunan yang berisi seluruh anggota yang sedang dibicarakan disebut…",
    options: ["Himpunan kosong", "Himpunan semesta", "Himpunan bagian", "Himpunan komplemen"],
    answer: 1,
    explain: "Himpunan semesta (S) memuat seluruh anggota himpunan yang sedang dibicarakan."
  },
  {
    type: "mcq",
    q: "Kumpulan data yang rapi dan memiliki pola keteraturan yang jelas disebut…",
    options: ["Himpunan data tidak terstruktur", "Himpunan data terstruktur", "Himpunan kosong", "Himpunan komplemen"],
    answer: 1,
    explain: "Himpunan data terstruktur adalah kumpulan data yang rapi dan memiliki pola keteraturan yang jelas."
  },
  {
    type: "fill",
    prompt: "Lengkapi kalimat berikut dengan istilah operasi himpunan yang tepat.",
    before: "Operasi himpunan yang menghasilkan data yang ada di himpunan A dan juga ada di himpunan B disebut operasi ",
    after: ".",
    accepted: ["irisan"],
    explain: "Irisan (∩) menghasilkan data yang merupakan anggota dari kedua himpunan A dan B."
  },
  {
    type: "fill",
    prompt: "Lengkapi kalimat berikut dengan istilah operasi himpunan yang tepat.",
    before: "Operasi himpunan yang menghasilkan semua data yang ada di kedua himpunan disebut operasi ",
    after: ".",
    accepted: ["gabungan"],
    explain: "Gabungan (∪) menggabungkan seluruh anggota dari himpunan A maupun himpunan B."
  },
  {
    type: "mcq",
    q: "Data yang ada di himpunan semesta S namun tidak ada di himpunan A disebut…",
    options: ["Irisan A", "Gabungan A", "Selisih A", "Komplemen A"],
    answer: 3,
    explain: "Komplemen A (A′) adalah data yang ada di himpunan semesta S tetapi tidak ada di himpunan A."
  },
  {
    type: "mcq",
    q: "Stack adalah struktur data yang digunakan untuk menyimpan sejumlah objek atau variabel dengan menerapkan prinsip…",
    options: ["FIFO (First In First Out)", "LIFO (Last In First Out)", "Acak", "Terurut abjad"],
    answer: 1,
    explain: "Stack menerapkan prinsip LIFO, yaitu data yang terakhir dimasukkan akan menjadi data pertama yang dikeluarkan."
  },
  {
    type: "fill",
    prompt: "Lengkapi kalimat berikut dengan istilah yang tepat.",
    before: "Prinsip kerja stack, di mana data yang terakhir dimasukkan akan menjadi data pertama yang dikeluarkan, disingkat ",
    after: ".",
    accepted: ["lifo", "last in first out"],
    explain: "LIFO adalah singkatan dari Last In First Out, prinsip kerja utama pada struktur data stack."
  },
  {
    type: "mcq",
    q: "Jika angka 1 lalu angka 2 dimasukkan berturut-turut ke dalam stack, angka yang akan keluar lebih dulu adalah…",
    options: ["Angka 1", "Angka 2", "Keduanya keluar bersamaan", "Tidak ada yang keluar"],
    answer: 1,
    explain: "Karena stack bersifat LIFO, angka 2 yang dimasukkan paling akhir akan menjadi yang pertama keluar."
  },
  {
    type: "fill",
    prompt: "Lengkapi kalimat berikut dengan istilah yang tepat.",
    before: "Operasi untuk memasukkan elemen baru ke dalam stack disebut operasi ",
    after: ".",
    accepted: ["push"],
    explain: "Push adalah operasi memasukkan elemen baru ke bagian atas (top) stack."
  },
  {
    type: "fill",
    prompt: "Lengkapi kalimat berikut dengan istilah yang tepat.",
    before: "Operasi untuk mengeluarkan elemen dari bagian atas stack disebut operasi ",
    after: ".",
    accepted: ["pop"],
    explain: "Pop adalah operasi mengeluarkan elemen dari bagian atas (top) stack."
  },
  {
    type: "mcq",
    q: "Pada ilustrasi operasi ekspresi matematika dengan stack, ketika operator '+' masuk setelah dua angka dimasukkan ke dalam stack, maka yang terjadi adalah…",
    options: ["Kedua angka dihapus tanpa diproses", "Dua angka terakhir dikeluarkan untuk dioperasikan, lalu hasilnya dimasukkan kembali ke stack", "Stack menjadi kosong secara permanen", "Angka pertama tetap berada di stack tanpa diproses"],
    answer: 1,
    explain: "Saat operator masuk, dua angka teratas dikeluarkan (pop) untuk dioperasikan, kemudian hasilnya dimasukkan kembali (push) ke dalam stack — ini prinsip evaluasi ekspresi postfix menggunakan stack."
  }
];

let current = 0;
let score = 0;
let locked = false;
let studentName = "";
let studentClass = "";
const recap = [];

function esc(str) {
  return String(str)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

const card = document.getElementById("card");
const progressRow = document.getElementById("progress-row");
const progressFill = document.getElementById("progress-fill");
const progressLabel = document.getElementById("progress-label");
const introSub = document.getElementById("intro-sub");

function renderStart() {
  const fillCount = QUESTIONS.filter(q => q.type === "fill").length;
  card.innerHTML = `
    <div>
      <p style="margin:0 0 24px; font-size:15px; color:var(--muted); line-height:1.6;">
        Sebelum memulai, silakan isi data diri Anda terlebih dahulu.
      </p>
      <div class="form-group">
        <label for="name-input">Nama Lengkap</label>
        <input type="text" id="name-input" placeholder="Masukkan nama Anda">
      </div>
      <div class="form-group">
        <label for="class-input">Kelas</label>
        <input type="text" id="class-input" placeholder="Masukkan kelas Anda (contoh: 8 Maryam)">
      </div>
      <p style="margin:16px 0 20px; font-size:15px; color:var(--muted); line-height:1.6;">
        Kamu akan menjawab ${QUESTIONS.length} soal seputar Informatika Bab 2 —
        mulai dari computational thinking, fungsi, himpunan data terstruktur,
        sampai struktur data stack. ${fillCount} di antaranya adalah soal
        isian: lengkapi kata atau istilah yang kosong pada kalimat.
      </p>
      <button class="btn-primary show" id="start-btn">Mulai kuis</button>
    </div>
  `;
  document.getElementById("start-btn").addEventListener("click", () => {
    const nameInput = document.getElementById("name-input");
    const classInput = document.getElementById("class-input");
    
    if (!nameInput.value.trim() || !classInput.value.trim()) {
      alert("Mohon isi nama dan kelas terlebih dahulu.");
      return;
    }
    
    studentName = nameInput.value.trim();
    studentClass = classInput.value.trim();
    
    introSub.style.display = "none";
    progressRow.style.display = "flex";
    renderQuestion();
  });
}

function renderQuestion() {
  locked = false;
  const q = QUESTIONS[current];
  progressFill.style.width = `${(current / QUESTIONS.length) * 100}%`;
  progressLabel.textContent = `Soal ${current + 1}/${QUESTIONS.length}`;

  if (q.type === "fill") {
    renderFillQuestion(q);
    return;
  }

  let optionsHtml = "";
  if (q.type === "mcq") {
    optionsHtml = `<div class="options">` + q.options.map((opt, i) =>
      `<button class="opt-btn" data-i="${i}"><span class="k mono">${String.fromCharCode(65+i)}</span>${esc(opt)}</button>`
    ).join("") + `</div>`;
  } else {
    optionsHtml = `<div class="tf-row">
      <button class="opt-btn" data-i="true">Benar</button>
      <button class="opt-btn" data-i="false">Salah</button>
    </div>`;
  }

  card.innerHTML = `
    <span class="tag">${q.type === "mcq" ? "Pilihan Ganda" : "Benar / Salah"}</span>
    <p class="question-text">${q.type === "mcq" ? q.q : "Perhatikan pernyataan berikut:"}</p>
    ${q.type === "tf" ? `<p class="question-text" style="font-size:15.5px; font-weight:500;">${q.claim}</p>` : ""}
    ${optionsHtml}
    <div class="feedback" id="feedback"></div>
    <div class="next-row"><button class="btn-primary" id="next-btn">${current === QUESTIONS.length - 1 ? "Lihat hasil" : "Lanjut"}</button></div>
  `;

  const buttons = card.querySelectorAll(".opt-btn");
  buttons.forEach(btn => btn.addEventListener("click", () => handleAnswer(btn, buttons, q)));
}

function renderFillQuestion(q) {
  const widthCh = Math.max(8, (q.accepted[0].length || 8) + 2);

  card.innerHTML = `
    <span class="tag">Isian: Lengkapi Kalimat</span>
    <p class="question-text">${q.prompt}</p>
    <div class="sentence-panel">${esc(q.before)}<input type="text" id="blank-input" class="blank-input" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="…" style="width:${widthCh}ch">${esc(q.after)}</div>
    <div class="next-row check-row" style="justify-content:flex-start;">
      <button class="btn-primary show" id="check-btn">Periksa jawaban</button>
    </div>
    <div class="feedback" id="feedback"></div>
    <div class="next-row"><button class="btn-primary" id="next-btn">${current === QUESTIONS.length - 1 ? "Lihat hasil" : "Lanjut"}</button></div>
  `;

  const input = document.getElementById("blank-input");
  input.focus();
  input.addEventListener("input", () => {
    input.style.width = Math.max(widthCh, input.value.length + 2) + "ch";
  });

  document.getElementById("check-btn").addEventListener("click", () => {
    if (locked) return;
    locked = true;

    const normalized = input.value.trim().toLowerCase().replace(/[.;]$/, "");
    const isCorrect = q.accepted.map(a => a.toLowerCase()).includes(normalized);

    input.disabled = true;
    input.style.borderBottomColor = isCorrect ? "var(--good)" : "var(--bad)";
    document.getElementById("check-btn").classList.remove("show");

    if (isCorrect) score++;
    recap.push({ ok: isCorrect, text: q.prompt });

    const feedback = document.getElementById("feedback");
    feedback.classList.add("show", isCorrect ? "good" : "bad");
    feedback.innerHTML = `<strong>${isCorrect ? "Tepat." : "Belum tepat."}</strong> ${q.explain}`;

    document.getElementById("next-btn").classList.add("show");
    document.getElementById("next-btn").addEventListener("click", () => {
      current++;
      if (current < QUESTIONS.length) {
        renderQuestion();
      } else {
        renderResult();
      }
    }, { once: true });
  }, { once: true });
}

function handleAnswer(btn, allButtons, q) {
  if (locked) return;
  locked = true;

  let isCorrect;
  if (q.type === "mcq") {
    isCorrect = parseInt(btn.dataset.i, 10) === q.answer;
    allButtons.forEach(b => {
      const i = parseInt(b.dataset.i, 10);
      if (i === q.answer) b.classList.add("correct");
      else if (b === btn) b.classList.add("incorrect");
      b.disabled = true;
    });
  } else {
    const chosen = btn.dataset.i === "true";
    isCorrect = chosen === q.answer;
    allButtons.forEach(b => {
      const val = b.dataset.i === "true";
      if (val === q.answer) b.classList.add("correct");
      else if (b === btn) b.classList.add("incorrect");
      b.disabled = true;
    });
  }

  if (isCorrect) score++;
  recap.push({ ok: isCorrect, text: q.type === "mcq" ? q.q : q.claim });

  const feedback = document.getElementById("feedback");
  feedback.classList.add("show", isCorrect ? "good" : "bad");
  feedback.innerHTML = `<strong>${isCorrect ? "Tepat." : "Belum tepat."}</strong> ${q.explain}`;

  document.getElementById("next-btn").classList.add("show");
  document.getElementById("next-btn").addEventListener("click", () => {
    current++;
    if (current < QUESTIONS.length) {
      renderQuestion();
    } else {
      renderResult();
    }
  }, { once: true });
}

function renderResult() {
  progressFill.style.width = "100%";
  progressLabel.textContent = `Soal ${QUESTIONS.length}/${QUESTIONS.length}`;

  const total = QUESTIONS.length;
  const pct = score / total;
  let msg, sub;
  if (pct >= 0.9) {
    msg = "Luar biasa!";
    sub = "Pemahaman kamu tentang computational thinking, fungsi, himpunan, dan stack sudah sangat solid.";
  } else if (pct >= 0.7) {
    msg = "Kerja bagus!";
    sub = "Fondasinya sudah kuat, tinggal perhalus beberapa istilah.";
  } else if (pct >= 0.5) {
    msg = "Cukup baik.";
    sub = "Sudah paham sebagian besar konsep, coba tinjau lagi bagian yang meleset.";
  } else {
    msg = "Terus berlatih.";
    sub = "Tidak apa — coba baca ulang materi tentang computational thinking, fungsi, himpunan, dan stack, lalu ulangi kuisnya.";
  }

  const recapHtml = recap.map(r =>
    `<div class="recap-item"><span class="mark ${r.ok ? "ok" : "no"}">${r.ok ? "OK" : "X"}</span><span>${r.text}</span></div>`
  ).join("");

  card.innerHTML = `
    <div class="result">
      <div class="tag">Selesai</div>
      <div class="student-info">
        <div class="si-group">
          <span class="label">Nama</span>
          <span class="value">${esc(studentName)}</span>
        </div>
        <div class="si-group">
          <span class="label">Kelas</span>
          <span class="value">${esc(studentClass)}</span>
        </div>
      </div>
      <div class="score-big mono">${score}/${total}</div>
      <div class="score-of">jawaban benar</div>
      <div class="result-msg">${msg}</div>
      <p class="result-sub">${sub}</p>
      <div class="recap">${recapHtml}</div>
      <button class="btn-restart" id="restart-btn">Ulangi kuis</button>
    </div>
  `;

  document.getElementById("restart-btn").addEventListener("click", () => {
    current = 0;
    score = 0;
    recap.length = 0;
    studentName = "";
    studentClass = "";
    progressFill.style.width = "0%";
    progressLabel.textContent = `1/${QUESTIONS.length}`;
    introSub.style.display = "block";
    progressRow.style.display = "none";
    renderStart();
  });
}

renderStart();

/* ── Anti-Curang Logic ── */
(function() {
  const MAX_VIOLATIONS = 3;
  const SUSPEND_SECS   = 30;

  let violations     = 0;
  let suspendTimer   = null;
  let quizStarted    = false;  // aktif setelah klik "Mulai kuis"
  let quizDone       = false;
  let suspended      = false;

  const overlay    = document.getElementById('cheat-overlay');
  const title      = document.getElementById('cheat-title');
  const msg        = document.getElementById('cheat-msg');
  const countdown  = document.getElementById('cheat-countdown');
  const warnCount  = document.getElementById('cheat-warning-count');

  // Tandai kuis sudah dimulai saat start-btn diklik
  document.addEventListener('click', function(e) {
    if (e.target && e.target.id === 'start-btn') {
      quizStarted = true;
    }
  }, true);

  function triggerViolation() {
    if (!quizStarted || quizDone || suspended) return;

    violations++;

    if (violations > MAX_VIOLATIONS) {
      // Sudah melebihi batas — akhiri quiz
      endQuizByCheat();
      return;
    }

    suspended = true;
    overlay.classList.add('show');

    if (violations === MAX_VIOLATIONS) {
      title.textContent = 'Peringatan terakhir';
      msg.textContent   = 'Pelanggaran ke-' + violations + '. Jika terdeteksi lagi, kuis langsung diakhiri.';
    } else {
      title.textContent = 'Tab berpindah terdeteksi';
      msg.textContent   = 'Kuis dikunci sementara. Tunggu hingga hitungan selesai.';
    }

    warnCount.textContent = 'Pelanggaran: ' + violations + ' / ' + MAX_VIOLATIONS;

    let secs = SUSPEND_SECS;
    countdown.textContent = secs;

    suspendTimer = setInterval(function() {
      secs--;
      countdown.textContent = secs;
      if (secs <= 0) {
        clearInterval(suspendTimer);
        overlay.classList.remove('show');
        suspended = false;
      }
    }, 1000);
  }

  function endQuizByCheat() {
    quizDone = true;
    suspended = false;
    clearInterval(suspendTimer);
    overlay.classList.remove('show');
    // Paksa render hasil dengan score saat ini
    renderResult();
    // Tambahkan banner info di atas hasil
    const resultDiv = card.querySelector('.result');
    if (resultDiv) {
      const banner = document.createElement('div');
      banner.style.cssText = 'background:var(--bad-soft);border:1px solid var(--bad);color:var(--bad);border-radius:6px;padding:12px 16px;font-size:14px;margin-bottom:20px;line-height:1.5;';
      banner.innerHTML = '<strong>Kuis Diakhiri Otomatis.</strong> Kamu terdeteksi keluar tab sebanyak ' + violations + ' kali. Nilai dihitung berdasarkan soal yang sudah dijawab.';
      resultDiv.prepend(banner);
    }
  }

  // Deteksi pindah tab (Page Visibility API)
  document.addEventListener('visibilitychange', function() {
    if (document.hidden) triggerViolation();
  });

  // Deteksi pindah window / minimize (blur)
  window.addEventListener('blur', function() {
    triggerViolation();
  });

  // Tandai kuis selesai secara normal
  // (patch renderResult agar quizDone = true)
  const _origRenderResult = renderResult;
  window.renderResult = function() {
    quizDone = true;
    _origRenderResult();
  };

})();
</script>
